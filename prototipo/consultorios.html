<title>Mis Consultorios</title>

<style>
/* Layout: menú lateral en compu, barra inferior en celular; la agenda es el centro */
:root {

  --t-reserva-bg: #DCF3E8; --t-reserva-line: #148B5E; --t-reserva-fg: #0B3D2B;
  --t-propio-bg: #ECE6FB; --t-propio-line: #6D4AD1; --t-propio-fg: #2E1D66;

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --hora: 46px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1217; --surface: #171B22; --sunken: #1E232C; --line: #2C323D; --line-soft: #242A33;
  --fg: #E9ECF1; --muted: #A3AAB7; --faint: #79808D;
  --accent: #6E97FF; --accent-ink: #0B1530; --accent-soft: #1D2A4A; --accent-strong: #A9C1FF;
  --good: #5FD3A2; --good-soft: #13302A; --warn: #F2B566; --warn-soft: #362712; --bad: #FF9A80; --bad-soft: #3A1D16;
  --t-contrato-bg: #1D2D52; --t-contrato-line: #6E97FF; --t-contrato-fg: #D4E1FF;
  --t-reserva-bg: #143428; --t-reserva-line: #4CC892; --t-reserva-fg: #CFF3E2;
  --t-propio-bg: #2A2150; --t-propio-line: #A48BF0; --t-propio-fg: #E4DCFF;
  --t-bloqueo-bg: #262B33; --t-bloqueo-line: #79808D; --t-bloqueo-fg: #D2D6DD;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1217; --surface: #171B22; --sunken: #1E232C; --line: #2C323D; --line-soft: #242A33;
  --fg: #E9ECF1; --muted: #A3AAB7; --faint: #79808D;
  --accent: #6E97FF; --accent-ink: #0B1530; --accent-soft: #1D2A4A; --accent-strong: #A9C1FF;
  --good: #5FD3A2; --good-soft: #13302A; --warn: #F2B566; --warn-soft: #362712; --bad: #FF9A80; --bad-soft: #3A1D16;
  --t-contrato-bg: #1D2D52; --t-contrato-line: #6E97FF; --t-contrato-fg: #D4E1FF;
  --t-reserva-bg: #143428; --t-reserva-line: #4CC892; --t-reserva-fg: #CFF3E2;
  --t-propio-bg: #2A2150; --t-propio-line: #A48BF0; --t-propio-fg: #E4DCFF;
  --t-bloqueo-bg: #262B33; --t-bloqueo-line: #79808D; --t-bloqueo-fg: #D2D6DD;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; font-weight: 600; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }

/* App frame */
.app { display: flex; min-height: 100vh; }
.side { width: 232px; flex: 0 0 232px; background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.brand-name { font-family: var(--f-display); font-weight: 600; font-size: 1rem; line-height: 1.15; }
.brand-sub { font-size: .78rem; color: var(--muted); }
.nav-btn { display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: .92rem; text-align: left; width: 100%; }
.nav-btn:hover { background: var(--sunken); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); }
.nav-btn svg { flex: 0 0 auto; }
.side-foot { margin-top: auto; padding: 10px; font-size: .78rem; color: var(--faint); display: flex; flex-direction: column; gap: 4px; }
.main { flex: 1 1 auto; min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.bottom-nav { display: none; }
@media (min-width: 900px) { .main { padding-left: 32px; padding-right: 32px; } }
@media (max-width: 899px) {
  .side { display: none; }
  .main { padding-block: 16px 104px; }
  .bottom-nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .bottom-nav .nav-btn { flex-direction: column; justify-content: center; gap: 3px; min-height: 54px; padding: 0; font-size: .7rem; text-align: center; }
  .bottom-nav .nav-btn[aria-current="page"] { background: transparent; color: var(--accent); }
}

/* Header row */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eyebrow { font-size: .8rem; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 15px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: .9rem; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-strong); padding: 0 8px; }
.btn.sm { min-height: 36px; padding: 0 11px; font-size: .84rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 40px; padding: 0 13px; border: 0; background: transparent; font-weight: 600; font-size: .86rem; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.icon-btn { width: 40px; min-height: 40px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); }
.period { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); overflow: hidden; }
.period span { padding: 0 10px; font-weight: 600; font-size: .88rem; min-width: 150px; text-align: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: 40px; }
select.sel, input.inp, textarea.inp { min-height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); width: 100%; }
textarea.inp { padding: 10px 12px; min-height: 72px; resize: vertical; }
select.sel.auto { width: auto; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: .8rem; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-height: 38px; padding: 0 13px; border-radius: 19px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .84rem; color: var(--muted); }
.chip-btn[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }

/* Surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.panel-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); }
.panel-b { padding: 16px 18px; }
.rows > * + * { border-top: 1px solid var(--line-soft); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; min-width: 0; }
.row-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-btn { width: 100%; border: 0; background: transparent; text-align: left; }
.row-btn:hover { background: var(--sunken); }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.kpi-l { font-size: .8rem; color: var(--muted); font-weight: 500; }
.kpi-v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi-s { font-size: .78rem; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 6px; font-size: .74rem; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent-strong); }
.pill.neutral { background: var(--sunken); color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px; }
.amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amount.bad { color: var(--bad); }
.amount.good { color: var(--good); }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
table.t th { text-align: left; font-size: .76rem; font-weight: 600; color: var(--muted); padding: 10px 14px; background: var(--sunken); white-space: nowrap; }
table.t td { padding: 11px 14px; border-top: 1px solid var(--line-soft); vertical-align: middle; }
table.t .r { text-align: right; font-variant-numeric: tabular-nums; }

/* Types */
.ty-contrato { background: var(--t-contrato-bg); border: 1px solid var(--t-contrato-line); color: var(--t-contrato-fg); }
.ty-reserva { background: var(--t-reserva-bg); border: 1px solid var(--t-reserva-line); color: var(--t-reserva-fg); }
.ty-uso_propio { background: var(--t-propio-bg); border: 1px solid var(--t-propio-line); color: var(--t-propio-fg); }
.ty-bloqueo { background: var(--t-bloqueo-bg); border: 1px dashed var(--t-bloqueo-line); color: var(--t-bloqueo-fg); }
.ty-pend { background: var(--warn-soft); border: 1px dashed var(--warn); color: var(--warn); }

/* Vista del profesional */
.pv-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: .86rem; }
.pv-banner select { color: var(--fg); }
.pv { width: 100%; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.pv-hero { background: var(--fg); color: var(--bg); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.pv-hero .pv-k { font-size: .8rem; opacity: .75; }
.pv-hero .pv-big { font-family: var(--f-display); font-size: 1.45rem; font-weight: 600; }
.daychips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.daychip { flex: 0 0 auto; min-width: 58px; min-height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-weight: 700; }
.daychip small { font-size: .7rem; font-weight: 500; color: var(--muted); }
.daychip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.daychip[aria-pressed="true"] small { color: var(--bg); opacity: .8; }
.daychip:disabled { opacity: .45; cursor: not-allowed; }
.slotbar { position: relative; height: 24px; border-radius: 6px; background: color-mix(in srgb, var(--good) 24%, var(--surface)); overflow: hidden; }
.slotbar i { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--faint) 45%, var(--surface)); }
.slotbar em { position: absolute; top: 0; bottom: 0; border: 2px solid var(--accent); border-radius: 5px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { min-width: 64px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--good) 45%, var(--line)); background: color-mix(in srgb, var(--good) 12%, var(--surface)); color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.slot:hover { border-color: var(--good); }
.pv-step { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .95rem; }
.pv-step b { width: 24px; height: 24px; border-radius: 50%; background: var(--fg); color: var(--bg); display: inline-grid; place-items: center; font-size: .78rem; }
.rep-list { display: flex; flex-wrap: wrap; gap: 6px; }
.rep-list span { font-size: .78rem; padding: 3px 8px; border-radius: 8px; background: var(--good-soft, color-mix(in srgb, var(--good) 14%, var(--surface))); }
.rep-list span.no { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); text-decoration: line-through; }
.slot-scale { display: flex; justify-content: space-between; font-size: .7rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; }

/* Agenda grid */
.grid-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tg { display: grid; min-width: var(--minw, 720px); }
.tg-corner { border-bottom: 1px solid var(--line); position: sticky; left: 0; background: var(--surface); z-index: 3; }
.tg-head { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line-soft); padding: 9px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; background: var(--surface); text-align: left; border-top: 0; border-right: 0; }
button.tg-head:hover { background: var(--sunken); }
.tg-head b { font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tg-head.today b { color: var(--accent-strong); }
.tg-hours { position: sticky; left: 0; z-index: 2; background: var(--surface); }
.tg-hours div { height: var(--hora); font-size: .72rem; color: var(--faint); text-align: right; padding: 3px 8px 0 0; font-variant-numeric: tabular-nums; }
.tg-col { position: relative; border-left: 1px solid var(--line-soft); background-image: repeating-linear-gradient(to bottom, var(--line-soft) 0, var(--line-soft) 1px, transparent 1px, transparent var(--hora)); cursor: copy; }
.tg-col.closed { background-color: var(--sunken); cursor: not-allowed; }
.blk { position: absolute; left: 3px; right: 3px; border-radius: 7px; padding: 5px 7px; text-align: left; overflow: hidden; display: flex; flex-direction: column; gap: 1px; cursor: pointer; }
.blk b { font-size: .78rem; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk span { font-size: .72rem; line-height: 1.2; opacity: .9; }
.blk:hover { filter: brightness(.97); box-shadow: var(--shadow); z-index: 1; }
.now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 2; pointer-events: none; }

/* Week matrix */
.wm { display: grid; min-width: 880px; }
.wm-cell { min-height: 60px; padding: 9px; border-left: 1px solid var(--line-soft); border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; justify-content: center; gap: 6px; background: transparent; border-right: 0; border-bottom: 0; text-align: left; }
.wm-cell:hover { background: var(--sunken); }
.strip { position: relative; height: 20px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
.strip i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }

/* Month */
.mg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); min-width: 640px; }
.mg-h { padding: 9px 10px; font-size: .78rem; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
.mg-d { min-height: 86px; padding: 8px 10px; border-left: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 6px; background: transparent; border-top: 0; border-right: 0; text-align: left; }
.mg-d:hover:not(:disabled) { background: var(--sunken); }
.mg-d:disabled { cursor: default; }
.mg-d.out { color: var(--faint); background: color-mix(in srgb, var(--sunken) 50%, transparent); }
.mg-d.today .mg-n { color: var(--accent-strong); font-weight: 800; }
.mg-n { font-weight: 600; font-size: .9rem; }
.heat-0 { background: var(--sunken); color: var(--muted); }
.heat-1 { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent-strong); }
.heat-2 { background: color-mix(in srgb, var(--accent) 38%, var(--surface)); color: var(--fg); }
.heat-3 { background: color-mix(in srgb, var(--accent) 68%, var(--surface)); color: var(--accent-ink); }
.heat-4 { background: var(--accent); color: var(--accent-ink); }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 16, .45); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.modal { width: 100%; max-width: 560px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column; margin: auto 0; }
.modal.wide { max-width: 760px; }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
.modal-b { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line-soft); }
.modal-f .spacer { margin-right: auto; }
.note { padding: 10px 12px; border-radius: 9px; font-size: .86rem; line-height: 1.45; }
.note.bad { background: var(--bad-soft); color: var(--bad); }

<script>
"use strict";
/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ars = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
const money = (n) => ars.format(Math.round(Number(n) || 0));
const pad = (n) => String(n).padStart(2, "0");
const toISO = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const hoy = () => toISO(new Date());
const wd = (s) => (fromISO(s).getDay() + 6) % 7; // 0 = lunes
const DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const DIAS_L = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const hm = (min) => pad(Math.floor(min / 60)) + ":" + pad(min % 60);
const toMin = (s) => { const [h, m] = String(s).split(":").map(Number); return h * 60 + (m || 0); };
const fCorta = (s) => { const d = fromISO(s); return d.getDate() + "/" + (d.getMonth() + 1); };
const fLarga = (s) => { const d = fromISO(s); return DIAS_L[wd(s)] + " " + d.getDate() + " de " + MESES[d.getMonth()]; };
const mesDe = (s) => s.slice(0, 7);
const mesLabel = (ym) => { const [y, m] = ym.split("-").map(Number); return MESES[m - 1].replace(/^./, (c) => c.toUpperCase()) + " " + y; };
const addMonths = (ym, n) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const diasDelMes = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const COLORES = ["#2F62D8", "#148B5E", "#B4530C", "#6D4AD1", "#C0306A", "#0E7490", "#7C6A0A", "#4B5563", "#9333EA", "#0F766E"];
const TIPOS = { contrato: "Horario fijo", reserva: "Reserva", uso_propio: "Uso propio", bloqueo: "Bloqueo" };

const ICON = {
  inicio: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  agenda: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  profesionales: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>',
  cobros: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6.5 15h4"/></svg>',
  mas: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  avisos: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 9.5h6M9 12.5h4"/></svg>',
  prev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const TABS = [["inicio", "Inicio"], ["agenda", "Agenda"], ["profesionales", "Profesionales"], ["cobros", "Cobros"], ["mas", "Más"]];

/* ============ Datos ============ */
const COLS = ["consultorios", "profesionales", "series", "ocupaciones", "movimientos", "gastos", "tareas", "socios", "socmov", "avisos"];
const DEF_CONFIG = { nombre: "", abre: "08:00", cierra: "21:00", diasAbiertos: [true, true, true, true, true, true, false], horasCancelacion: 24, diasGracia: 5, configurado: false, tarifario: { hora: 0, modulos: [], historial: [] } };
const D = { config: { ...DEF_CONFIG } };
COLS.forEach((c) => (D[c] = {}));
let db = null, downloads = null, modoLocal = false, listo = false;
const LS_KEY = "mis-consultorios-v1";

function guardarLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(D)); } catch (e) { /* sin almacenamiento */ } }
function cargarLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); D.config = { ...DEF_CONFIG, ...(o.config || {}) }; COLS.forEach((c) => (D[c] = o[c] || {})); } } catch (e) { /* vacío */ }
}
let renderPend = false;
function pedirRender() { if (renderPend) return; renderPend = true; requestAnimationFrame(() => { renderPend = false; render(); }); }

async function put(col, id, data) {
  const body = { ...data }; delete body.id;
  D[col][id] = { id, ...body }; pedirRender();
  if (modoLocal) { guardarLocal(); return true; }
  try { await db.collection(col).doc(id).set(body); return true; }
  catch (e) { toast(e && e.code === "quota_exceeded" ? "Se llenó el espacio de datos. Borrá registros viejos." : "No se pudo guardar. Revisá la conexión y probá de nuevo."); return false; }
}
async function del(col, id) {
  delete D[col][id]; pedirRender();
  if (modoLocal) { guardarLocal(); return true; }
  try { await db.collection(col).doc(id).delete(); return true; } catch (e) { toast("No se pudo borrar. Probá de nuevo."); return false; }
}
async function putConfig(data) {
  D.config = { ...D.config, ...data }; pedirRender();
  if (modoLocal) { guardarLocal(); return; }
  try { await db.doc("config/main").set(D.config); } catch (e) { toast("No se pudo guardar la configuración."); }
}

async function iniciar() {
  try { db = window.claude && claude.use ? await claude.use("db") : null; } catch (e) { db = null; }
  try { downloads = window.claude && claude.use ? await claude.use("downloads") : null; } catch (e) { downloads = null; }
  if (!db) {
    modoLocal = true; cargarLocal(); listo = true;
    $("#syncState").textContent = "Guardado solo en este dispositivo";
    render(); return;
  }
  $("#syncState").textContent = "Sincronizado: compu y celular";
  const esperar = new Set(["config", ...COLS]);
  const marcar = (k) => { esperar.delete(k); if (!esperar.size && !listo) { listo = true; } pedirRender(); };
  const onErr = () => { $("#syncState").textContent = "Sin conexión: recargá la página"; };
  db.doc("config/main").onSnapshot((s) => { D.config = { ...DEF_CONFIG, ...(s.exists ? s.data() : {}) }; marcar("config"); }, onErr);
  COLS.forEach((c) => db.collection(c).limit(1000).onSnapshot((qs) => { const o = {}; qs.docs.forEach((d) => (o[d.id] = { id: d.id, ...d.data() })); D[c] = o; marcar(c); }, onErr));
  setTimeout(() => { if (!listo) { listo = true; pedirRender(); } }, 6000);
}

/* ============ Lógica de agenda ============ */
const lista = (col) => Object.values(D[col]);
const consultoriosAct = () => lista("consultorios").filter((c) => c.activo !== false).sort((a, b) => (a.orden || 0) - (b.orden || 0) || String(a.nombre).localeCompare(b.nombre));
const profesionalesAct = () => lista("profesionales").filter((p) => p.activo !== false).sort((a, b) => String(a.nombre).localeCompare(b.nombre));
const cons = (id) => D.consultorios[id];
const prof = (id) => D.profesionales[id];
const nomCons = (id) => (cons(id) ? cons(id).nombre : "Consultorio borrado");
const nomProf = (id) => (prof(id) ? prof(id).nombre : "Profesional borrado");
const abreMin = () => toMin(D.config.abre || "08:00");
const cierraMin = () => toMin(D.config.cierra || "21:00");
const abierto = (fecha) => !!(D.config.diasAbiertos || DEF_CONFIG.diasAbiertos)[wd(fecha)];
const horasDisp = (fecha) => (abierto(fecha) ? (cierraMin() - abreMin()) / 60 : 0);

function itemsDelDia(fecha) {
  const w = wd(fecha), out = [];
  for (const o of lista("ocupaciones")) {
    if (o.fecha === fecha && o.estado !== "cancelada") out.push({ ...o, kind: "one", key: "o:" + o.id });
  }
  for (const s of lista("series")) {
    if (s.dia === w && s.inicio <= fecha && (!s.fin || fecha <= s.fin) && !(s.excepciones || {})[fecha]) {
      out.push({ kind: "serie", id: s.id, key: "s:" + s.id + ":" + fecha, consultorioId: s.consultorioId, profesionalId: s.profesionalId || null, tipo: s.tipo, desde: s.desde, hasta: s.hasta, fecha, nota: s.nota || "", socioId: s.socioId || null });
    }
  }
  return out.sort((a, b) => a.desde - b.desde);
}
const horasOcup = (items) => items.reduce((t, x) => t + (x.tipo === "bloqueo" || x.estado === "pendiente" ? 0 : (x.hasta - x.desde) / 60), 0);
function ocupacionDia(fecha, consId) {
  const activos = new Set(consultoriosAct().map((c) => c.id));
  const items = itemsDelDia(fecha).filter((x) => (consId ? x.consultorioId === consId : activos.has(x.consultorioId)));
  const nCons = consId ? 1 : consultoriosAct().length;
  const disp = horasDisp(fecha) * nCons;
  const h = horasOcup(items);
  return { h, disp, pct: disp ? Math.round((h / disp) * 100) : 0 };
}
function etiquetaItem(x) {
  if (x.tipo === "uso_propio") return (x.socioId && D.socios[x.socioId] ? D.socios[x.socioId].nombre : "") || x.nota || "Uso propio";
  if (x.tipo === "bloqueo") return x.nota || "Bloqueado";
  return x.profesionalId ? nomProf(x.profesionalId) : "Sin profesional";
}
const solapa = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;

/* Revisa choques. nuevo: {consultorioId, profesionalId, desde, hasta, fechas[], ignorar(key)} */
function revisarChoques(nuevo) {
  const choques = [], avisos = [];
  for (const f of nuevo.fechas) {
    for (const x of itemsDelDia(f)) {
      if (nuevo.ignorar && nuevo.ignorar(x)) continue;
      if (!solapa(nuevo.desde, nuevo.hasta, x.desde, x.hasta)) continue;
      if (x.consultorioId === nuevo.consultorioId) choques.push({ f, x });
      else if (nuevo.profesionalId && x.profesionalId === nuevo.profesionalId) avisos.push({ f, x });
    }
  }
  return { choques, avisos };
}
function fechasSerie(inicio, fin, dia, semanas) {
  let f = inicio; while (wd(f) !== dia) f = addDays(f, 1);
  const out = [];
  for (let i = 0; i < semanas; i++) { if (fin && f > fin) break; out.push(f); f = addDays(f, 7); }
  return out;
}
const tarifario = () => ({ hora: 0, modulos: [], historial: [], ...(D.config.tarifario || {}) });
const tarifaHora = () => Number(tarifario().hora) || 0;
const precioHora = (profId, consId) => {
  const p = prof(profId), c = cons(consId);
  return (p && Number(p.precioHora)) || (c && Number(c.precioHora)) || tarifaHora();
};
function totalPlan(plan) {
  let precio = 0, horas = 0;
  for (const mod of tarifario().modulos) { const q = Number((plan || {})[mod.id] || 0); precio += q * Number(mod.precio || 0); horas += q * Number(mod.horas || 0); }
  return { precio, horas };
}
const textoExtra = (p) => (p.extraPorHora ? " + horas fijas de más a " + money(precioHora(p.id, null)) + "/h" : "");
// Horas fijas por encima del plan, semana por semana (lunes a domingo) dentro del mes
function horasExtraMes(p, ym) {
  const plan = Number(p.horasPlan) || 0, n = diasDelMes(ym), sem = {};
  let total = 0, horas = 0;
  for (let d = 1; d <= n; d++) {
    const f = ym + "-" + pad(d), k = addDays(f, -wd(f));
    for (const s of lista("series")) {
      if (s.profesionalId !== p.id || s.tipo !== "contrato" || s.dia !== wd(f) || s.inicio > f || (s.fin && f > s.fin)) continue;
      const ex = (s.excepciones || {})[f]; if (ex && !ex.tarde) continue;
      (sem[k] = sem[k] || []).push({ hs: (s.hasta - s.desde) / 60, precio: precioHora(p.id, s.consultorioId) });
    }
  }
  for (const k of Object.keys(sem)) {
    const tot = sem[k].reduce((t, x) => t + x.hs, 0), extra = Math.max(0, tot - plan);
    if (extra > 0) { const pr = sem[k].reduce((t, x) => t + x.hs * x.precio, 0) / tot; horas += extra; total += extra * pr; }
  }
  return { horas, total: Math.round(total) };
}
function textoPlan(p) {
  if (p.modalidad !== "mensual") return "Por hora " + money(precioHora(p.id, null)) + (Number(p.precioHora) ? "" : " (tarifa general)");
  if (p.planTipo === "modulos") {
    const partes = tarifario().modulos.filter((m) => Number((p.plan || {})[m.id])).map((m) => (Number(p.plan[m.id]) > 1 ? p.plan[m.id] + "× " : "") + m.nombre);
    return (partes.join(" + ") || "Módulos") + " · " + money(p.precioMensual) + " por mes" + textoExtra(p);
  }
  return "Precio especial " + money(p.precioMensual) + " por mes" + textoExtra(p);
}
function horasSemanaFijas(profId) {
  // horas de horarios fijos en los próximos 7 días (incluye cambios ya programados)
  let t = 0; const h = hoy();
  for (let i = 0; i < 7; i++) t += itemsDelDia(addDays(h, i)).filter((x) => x.kind === "serie" && x.tipo === "contrato" && x.profesionalId === profId).reduce((a, x) => a + (x.hasta - x.desde) / 60, 0);
  return t;
}
const esTarde = (fecha, desde) => {
  const inicio = fromISO(fecha); inicio.setMinutes(desde);
  return (inicio - new Date()) / 3600000 < Number(D.config.horasCancelacion || 24);
};

/* ============ Lógica de cuentas ============ */
function cuenta(profId, corte) {
  const h = corte || hoy(), gracia = Number(D.config.diasGracia || 5);
  const movs = lista("movimientos").filter((m) => m.profesionalId === profId).sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0));
  let cargos = 0, pagos = 0, futuros = 0;
  const cargosHoy = [];
  for (const m of movs) {
    const imp = Number(m.importe) || 0;
    if (m.tipo === "pago" || m.tipo === "credito") pagos += imp;
    else if (m.fecha <= h) { cargos += imp; cargosHoy.push(m); }
    else futuros += imp;
  }
  let resto = pagos, vencido = 0, masViejo = null;
  for (const c of cargosHoy) {
    const imp = Number(c.importe) || 0;
    const cubierto = Math.min(resto, imp); resto -= cubierto;
    const falta = imp - cubierto;
    if (falta > 0 && (c.vence || addDays(c.fecha, gracia)) < h) { vencido += falta; if (!masViejo) masViejo = c.fecha; }
  }
  return { saldo: cargos - pagos, vencido, futuros, masViejo, movs };
}
function cargosPendientes(ym) {
  const editable = ym >= mesDe(hoy());
  return cargosPropuestosMes(ym).filter((c) => !D.movimientos[c.id] || (editable && Number(D.movimientos[c.id].importe) !== c.importe));
}
function venceCargoMensual(ym) {
  const gracia = Number(D.config.diasGracia || 5), a = addDays(ym + "-01", gracia), b = addDays(hoy(), gracia);
  return a > b ? a : b;
}
function cargosPropuestosMes(ym) {
  const out = [];
  const n = diasDelMes(ym);
  for (const p of profesionalesAct()) {
    if (p.modalidad === "mensual") {
      if (Number(p.precioMensual) > 0) out.push({ id: "mes-" + ym + "-" + p.id, profesionalId: p.id, importe: Number(p.precioMensual), concepto: "Alquiler mensual " + mesLabel(ym).toLowerCase(), detalle: "Precio fijo mensual" });
      if (p.extraPorHora) { const ex = horasExtraMes(p, ym); if (ex.total > 0) out.push({ id: "ext-" + ym + "-" + p.id, profesionalId: p.id, importe: ex.total, concepto: "Horas fijas fuera del plan " + mesLabel(ym).toLowerCase() + " (" + fmtH(ex.horas) + ")", detalle: fmtH(ex.horas) + " por encima de " + fmtH(Number(p.horasPlan) || 0) + " semanales" }); }
    } else {
      let horas = 0, total = 0;
      for (let d = 1; d <= n; d++) {
        const f = ym + "-" + pad(d);
        for (const s of lista("series")) {
          if (s.profesionalId !== p.id || s.tipo !== "contrato" || s.dia !== wd(f) || s.inicio > f || (s.fin && f > s.fin)) continue;
          const ex = (s.excepciones || {})[f];
          if (ex && !ex.tarde) continue;
          const hs = (s.hasta - s.desde) / 60; horas += hs; total += hs * precioHora(p.id, s.consultorioId);
        }
      }
      if (total > 0) out.push({ id: "ser-" + ym + "-" + p.id, profesionalId: p.id, importe: Math.round(total), concepto: "Horarios fijos " + mesLabel(ym).toLowerCase() + " (" + horas + " h)", detalle: horas + " h a precio por hora" });
    }
  }
  return out;
}

/* ============ Socios y ganancias ============ */
const sociosAct = () => lista("socios").filter((x) => x.activo !== false).sort((a, b) => (b.porcentaje || 0) - (a.porcentaje || 0) || String(a.nombre).localeCompare(b.nombre));
function resultadoMes(ym, base) {
  const movs = lista("movimientos").filter((m) => mesDe(m.fecha) === ym);
  const ingresos = base === "devengado"
    ? movs.filter((m) => m.tipo === "cargo").reduce((t, m) => t + Number(m.importe || 0), 0) - movs.filter((m) => m.tipo === "credito").reduce((t, m) => t + Number(m.importe || 0), 0)
    : movs.filter((m) => m.tipo === "pago").reduce((t, m) => t + Number(m.importe || 0), 0);
  const gastos = lista("gastos").filter((g) => mesDe(g.fecha) === ym).reduce((t, g) => t + Number(g.importe || 0), 0);
  return { ingresos, gastos, resultado: ingresos - gastos };
}
function mesesConDatos() {
  const set = new Set();
  lista("movimientos").forEach((m) => m.fecha && set.add(mesDe(m.fecha)));
  lista("gastos").forEach((g) => g.fecha && set.add(mesDe(g.fecha)));
  lista("socmov").forEach((m) => m.fecha && set.add(mesDe(m.fecha)));
  return Array.from(set).sort();
}
function repartoSocios(ym, base) {
  const r = resultadoMes(ym, base), meses = mesesConDatos().filter((x) => x <= ym);
  return sociosAct().map((x) => {
    const pct = Number(x.porcentaje || 0) / 100;
    const mm = lista("socmov").filter((m) => m.socioId === x.id);
    const delMes = (tipo) => mm.filter((m) => m.tipo === tipo && mesDe(m.fecha) === ym).reduce((t, m) => t + Number(m.importe || 0), 0);
    let acumulado = 0;
    for (const k of meses) acumulado += resultadoMes(k, base).resultado * pct;
    mm.filter((m) => mesDe(m.fecha) <= ym).forEach((m) => (acumulado += (m.tipo === "aporte" ? 1 : -1) * Number(m.importe || 0)));
    return { socio: x, pct: x.porcentaje || 0, corresponde: r.resultado * pct, retiros: delMes("retiro"), aportes: delMes("aporte"), acumulado };
  });
}

/* ============ Datos por consultorio ============ */
const FRANJAS = [["Mañana", 8 * 60, 12 * 60], ["Mediodía", 12 * 60, 16 * 60], ["Tarde", 16 * 60, 21 * 60]];
function statsConsultorios(ym) {
  const cs = lista("consultorios").sort((a, b) => (a.orden || 0) - (b.orden || 0));
  const activos = consultoriosAct();
  const st = {};
  cs.forEach((c) => (st[c.id] = { c, h: 0, d: 0, propio: 0, bloqueo: 0, porQuien: {}, ingFijos: 0, ingReservas: 0, gastosDir: 0, gastosGen: 0, franja: DIAS.map(() => FRANJAS.map(() => ({ o: 0, d: 0 }))) }));
  const horasProf = {}; // horas de contrato por profesional en el mes (todas las salas)
  const horasProfCons = {}; // por profesional y sala
  const a0 = abreMin(), c0 = cierraMin();
  for (let i = 1; i <= diasDelMes(ym); i++) {
    const f = ym + "-" + pad(i), w = wd(f), disp = horasDisp(f), items = itemsDelDia(f);
    cs.forEach((c) => {
      const S = st[c.id];
      if (c.activo !== false) S.d += disp;
      if (abierto(f)) FRANJAS.forEach(([, fa, fb], k) => { const ini = Math.max(fa, a0), fin = Math.min(fb, c0); if (fin > ini) S.franja[w][k].d += fin - ini; });
    });
    for (const x of items) {
      const S = st[x.consultorioId]; if (!S) continue;
      const hs = (x.hasta - x.desde) / 60;
      FRANJAS.forEach(([, fa, fb], k) => { const ini = Math.max(fa, x.desde), fin = Math.min(fb, x.hasta); if (fin > ini && x.tipo !== "bloqueo") S.franja[w][k].o += fin - ini; });
      if (x.tipo === "bloqueo") { S.bloqueo += hs; continue; }
      S.h += hs;
      const quien = etiquetaItem(x), clave = x.tipo === "uso_propio" ? "u:" + quien : x.profesionalId ? "p:" + x.profesionalId : "x:" + quien;
      S.porQuien[clave] = S.porQuien[clave] || { nombre: quien, tipo: x.tipo, h: 0 };
      S.porQuien[clave].h += hs;
      if (x.tipo === "uso_propio") S.propio += hs;
      if (x.tipo === "contrato" && x.profesionalId) {
        horasProf[x.profesionalId] = (horasProf[x.profesionalId] || 0) + hs;
        const k2 = x.profesionalId + "|" + x.consultorioId; horasProfCons[k2] = (horasProfCons[k2] || 0) + hs;
      }
      if (x.kind === "one" && x.tipo === "reserva") S.ingReservas += Number(x.importe || 0);
    }
  }
  // Ingresos de horarios fijos: lo cargado en el mes (o lo que corresponde si todavía no se generó), repartido según las horas en cada sala
  const cargosMes = {};
  lista("movimientos").filter((m) => m.tipo === "cargo" && mesDe(m.fecha) === ym && !String(m.id).startsWith("res-")).forEach((m) => (cargosMes[m.profesionalId] = (cargosMes[m.profesionalId] || 0) + Number(m.importe || 0)));
  const propuestos = {}; cargosPropuestosMes(ym).forEach((c) => (propuestos[c.profesionalId] = c.importe));
  Object.keys(horasProf).forEach((pid) => {
    const total = cargosMes[pid] != null ? cargosMes[pid] : propuestos[pid] || 0;
    Object.keys(horasProfCons).filter((k) => k.startsWith(pid + "|")).forEach((k) => { const cid = k.split("|")[1]; if (st[cid]) st[cid].ingFijos += total * (horasProfCons[k] / horasProf[pid]); });
  });
  // Gastos: los de cada sala, más los generales repartidos en partes iguales entre las salas activas
  const gastos = lista("gastos").filter((g) => mesDe(g.fecha) === ym);
  const generales = gastos.filter((g) => !g.consultorioId || !st[g.consultorioId]).reduce((t, g) => t + Number(g.importe || 0), 0);
  gastos.filter((g) => g.consultorioId && st[g.consultorioId]).forEach((g) => (st[g.consultorioId].gastosDir += Number(g.importe || 0)));
  activos.forEach((c) => (st[c.id].gastosGen = activos.length ? generales / activos.length : 0));
  return cs.map((c) => {
    const S = st[c.id];
    const ingreso = S.ingFijos + S.ingReservas, gastosT = S.gastosDir + S.gastosGen;
    const hAlq = S.h - S.propio;
    return { ...S, pct: S.d ? Math.round((S.h / S.d) * 100) : 0, libres: Math.max(0, S.d - S.h - S.bloqueo), ingreso, gastos: gastosT, resultado: ingreso - gastosT, porHora: hAlq > 0 ? ingreso / hAlq : 0, valorPropio: S.propio * Number(c.precioHora || 0) };
  });
}

function vistaInicio() {
  const h = hoy(), ym = UI.mesInicio || mesDe(h), esActual = ym === mesDe(h), esFuturo = ym > mesDe(h);
  const corte = esActual || esFuturo ? h : ym + "-" + pad(diasDelMes(ym));
  const movsMes = lista("movimientos").filter((m) => mesDe(m.fecha) === ym);
  const facturado = movsMes.filter((m) => m.tipo === "cargo").reduce((t, m) => t + Number(m.importe || 0), 0);
  const cobrado = movsMes.filter((m) => m.tipo === "pago").reduce((t, m) => t + Number(m.importe || 0), 0);
  const gastosMes = lista("gastos").filter((g) => mesDe(g.fecha) === ym).reduce((t, g) => t + Number(g.importe || 0), 0);
  // ocupación del mes
  let mesH = 0, mesD = 0; const porCons = {};
  consultoriosAct().forEach((c) => (porCons[c.id] = { h: 0, d: 0 }));
  for (let i = 1; i <= diasDelMes(ym); i++) {
    const f = ym + "-" + pad(i), disp = horasDisp(f), items = itemsDelDia(f);
    consultoriosAct().forEach((c) => { const hh = horasOcup(items.filter((x) => x.consultorioId === c.id)); porCons[c.id].h += hh; porCons[c.id].d += disp; mesH += hh; mesD += disp; });
  }
  const mesPct = mesD ? Math.round((mesH / mesD) * 100) : 0;
  const cuentas = profesionalesAct().map((p) => ({ p, c: cuenta(p.id, corte) }));
  const deudaTotal = cuentas.reduce((t, x) => t + Math.max(0, x.c.saldo), 0);
  const vencidos = cuentas.filter((x) => x.c.vencido > 0).sort((a, b) => b.c.vencido - a.c.vencido);
  const tareasProx = lista("tareas").filter((t) => t.estado !== "hecha" && t.proxima && t.proxima <= addDays(h, 7)).sort((a, b) => (a.proxima < b.proxima ? -1 : 1));
  const generados = cargosPropuestosMes(ym).filter((c) => !D.movimientos[c.id]);
  const pctCobro = facturado ? Math.min(100, Math.round((cobrado / facturado) * 100)) : 0;
  const mesN = MESES[Number(ym.slice(5)) - 1];

  const periodo = '<div class="tools"><div class="period"><button type="button" class="icon-btn" data-a="mes-inicio" data-v="-1" aria-label="Mes anterior">' + ICON.prev + "</button><span>" + mesLabel(ym) + '</span><button type="button" class="icon-btn" data-a="mes-inicio" data-v="1" aria-label="Mes siguiente">' + ICON.next + "</button></div>" + (esActual ? "" : '<button class="btn" data-a="mes-inicio-hoy">Este mes</button>') + '<button class="btn primary" data-a="nueva">' + ICON.plus + "Nueva reserva</button></div>";

  const atencion = [];
  if (esActual) {
    lista("ocupaciones").filter((o) => o.estado === "pendiente" && o.fecha >= h).sort((a, b) => (a.fecha + pad(a.desde) < b.fecha + pad(b.desde) ? -1 : 1)).forEach((o) => {
      const c = cuenta(o.profesionalId);
      atencion.push('<div class="row"><span class="pill warn">Reserva pedida</span><div class="row-main"><span class="row-title">' + esc(nomProf(o.profesionalId)) + '</span><span class="small muted">' + DIAS[wd(o.fecha)] + " " + fCorta(o.fecha) + " · " + hm(o.desde) + "–" + hm(o.hasta) + " · " + esc(nomCons(o.consultorioId)) + (c.vencido > 0 ? " · debe " + money(c.vencido) + " vencido" : "") + '</span></div><button class="btn sm" data-a="pend-rechazar" data-id="' + o.id + '">Rechazar</button><button class="btn sm primary" data-a="pend-aprobar" data-id="' + o.id + '">Aprobar</button></div>');

    lista("avisos").filter((a) => a.estado === "pendiente").sort((a, b) => (a.creado < b.creado ? -1 : 1)).forEach((a) => {

      else atencion.push('<div class="row"><span class="pill warn">Problema</span><div class="row-main"><span class="row-title">' + esc(a.texto) + '</span><span class="small muted">' + esc(nomProf(a.profesionalId)) + (a.consultorioId ? " · " + esc(nomCons(a.consultorioId)) : "") + " · " + fCorta(String(a.creado).slice(0, 10)) + '</span></div><button class="btn sm" data-a="aviso-descartar" data-id="' + a.id + '">Listo</button><button class="btn sm primary" data-a="aviso-tarea" data-id="' + a.id + '">Pasar a mantenimiento</button></div>');
    });
  }
  if (generados.length && !esFuturo) atencion.push('<div class="row"><span class="pill info">Cargos</span><div class="row-main"><span class="row-title">Faltan generar ' + generados.length + " cargos de " + mesN + '</span><span class="small muted">' + money(generados.reduce((t, c) => t + c.importe, 0)) + ' entre alquileres mensuales y horarios fijos</span></div><button class="btn sm primary" data-a="ir-cobros" data-v="' + ym + '">Revisar</button></div>');
  vencidos.forEach((x) => atencion.push('<div class="row"><span class="pill bad">Deuda</span><div class="row-main"><span class="row-title">' + esc(x.p.nombre) + '</span><span class="small muted">' + money(x.c.vencido) + " vencido desde el " + fCorta(x.c.masViejo) + (esActual ? "" : " (al " + fCorta(corte) + ")") + '</span></div><button class="btn sm" data-a="ver-prof" data-id="' + x.p.id + '">Ver cuenta</button></div>'));

  const statsC = statsConsultorios(ym).filter((x) => x.c.activo !== false);
  const tablaCons = '<div class="table-wrap"><table class="t"><thead><tr><th>Consultorio</th><th>Ocupación</th><th class="r">Horas usadas</th><th class="r">Horas libres</th><th class="r">Ingreso estimado</th><th class="r">Gastos</th><th class="r">Resultado</th></tr></thead><tbody>' +

  const ocupCons = consultoriosAct().map((c) => { const o = porCons[c.id] || { h: 0, d: 0 }; const pct = o.d ? Math.round((o.h / o.d) * 100) : 0; return '<div class="row" style="gap:10px"><span class="dot" style="background:' + esc(c.color || "#888") + '"></span><span style="flex:0 0 38%;min-width:0;font-weight:600;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.nombre) + '</span><span class="bar" style="flex:1 1 auto"><i style="width:' + pct + '%"></i></span><span class="num small" style="width:86px;text-align:right">' + pct + "% · " + fmtH(o.h) + "</span></div>"; }).join("");

const fmtH = (h) => (Math.round(h * 10) / 10).toLocaleString("es-AR") + " h";

function bloqueHTML(x, a, top0) {
  const top = ((x.desde - top0) / 60) * 46 + 2, alto = Math.max(20, ((x.hasta - x.desde) / 60) * 46 - 4);
  return '<button type="button" class="blk ty-' + x.tipo + (x.estado === "pendiente" ? " ty-pend" : "") + '" style="top:' + top + "px;height:" + alto + 'px" data-a="ver-item" data-key="' + esc(x.key) + '" aria-label="' + esc(etiquetaItem(x) + ", " + hm(x.desde) + " a " + hm(x.hasta) + ", " + nomCons(x.consultorioId)) + '"><b>' + esc(etiquetaItem(x)) + "</b><span>" + hm(x.desde) + "–" + hm(x.hasta) + (a ? " · " + esc(a) : "") + "</span></button>";
}
function horasCol(a, c) { let s = ""; for (let m = a; m < c; m += 60) s += "<div>" + hm(m) + "</div>"; return '<div class="tg-hours">' + s + "</div>"; }
function lineaAhora(fecha, a, c) {
  if (fecha !== hoy()) return "";
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  if (m < a || m > c) return "";
  return '<div class="now-line" style="top:' + ((m - a) / 60) * 46 + 'px"></div>';
}
function gridDia(f, cs) {
  const a = abreMin(), c = cierraMin(), alto = ((c - a) / 60) * 46, items = itemsDelDia(f), ab = abierto(f);
  const heads = cs.map((k) => { const o = ocupacionDia(f, k.id); return '<button type="button" class="tg-head" data-a="ver-semana-cons" data-id="' + k.id + '" title="Ver la semana de ' + esc(k.nombre) + '"><b><span class="dot" style="display:inline-block;margin-right:6px;background:' + esc(k.color || "#888") + '"></span>' + esc(k.nombre) + '</b><span class="bar"><i style="width:' + o.pct + '%"></i></span><span class="small muted num">' + o.pct + "% · " + fmtH(o.h) + "</span></button>"; }).join("");
  const colsHTML = cs.map((k) => '<div class="tg-col' + (ab ? "" : " closed") + '" style="height:' + alto + 'px" data-a="slot" data-cons="' + k.id + '" data-fecha="' + f + '">' + lineaAhora(f, a, c) + items.filter((x) => x.consultorioId === k.id).map((x) => bloqueHTML(x, "", a)).join("") + "</div>").join("");
  return '<div class="grid-scroll"><div class="tg" style="--minw:' + Math.max(380, 64 + cs.length * 130) + "px;grid-template-columns:56px repeat(" + cs.length + ', minmax(0,1fr))"><div class="tg-corner"></div>' + heads + horasCol(a, c) + colsHTML + "</div></div>" + (ab ? "" : '<p class="small muted">El lugar figura cerrado los ' + DIAS_L[wd(f)] + ". Podés cambiarlo en Más › Ajustes.</p>");
}
function gridSemanaCons(f, consId) {
  const a = abreMin(), c = cierraMin(), alto = ((c - a) / 60) * 46, l = addDays(f, -wd(f));
  const dias = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(l, i));

  const colsHTML = dias.map((d) => '<div class="tg-col' + (abierto(d) ? "" : " closed") + '" style="height:' + alto + 'px" data-a="slot" data-cons="' + consId + '" data-fecha="' + d + '">' + lineaAhora(d, a, c) + itemsDelDia(d).filter((x) => x.consultorioId === consId).map((x) => bloqueHTML(x, "", a)).join("") + "</div>").join("");
  return '<div class="grid-scroll"><div class="tg" style="--minw:900px;grid-template-columns:56px repeat(7, minmax(0,1fr))"><div class="tg-corner"></div>' + heads + horasCol(a, c) + colsHTML + "</div></div>";

function matrizSemana(f, cs) {
  const a = abreMin(), c = cierraMin(), span = c - a, l = addDays(f, -wd(f));
  const dias = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(l, i));

  let html = '<div class="grid-scroll"><div class="wm" style="grid-template-columns:150px repeat(7, minmax(0,1fr))"><div class="mg-h">' + hm(a) + " a " + hm(c) + "</div>";
  html += dias.map((d) => { const o = ocupacionDia(d); return '<button type="button" class="mg-h" style="border:0;border-left:1px solid var(--line-soft);border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer" data-a="ir-dia" data-fecha="' + d + '"><span style="color:' + (d === hoy() ? "var(--accent-strong)" : "var(--fg)") + '">' + DIAS[wd(d)] + " " + fromISO(d).getDate() + '</span><br><span class="num" style="font-weight:500">' + (abierto(d) ? o.pct + "%" : "cerrado") + "</span></button>"; }).join("");
  cs.forEach((k) => {
    let h = 0, disp = 0;
    const celdas = dias.map((d, i) => {
      const its = porDia[i].filter((x) => x.consultorioId === k.id); const hh = horasOcup(its); h += hh; disp += horasDisp(d);
      const segs = its.map((x) => '<i class="ty-' + x.tipo + '" style="left:' + (((x.desde - a) / span) * 100).toFixed(2) + "%;width:" + (((x.hasta - x.desde) / span) * 100).toFixed(2) + '%"></i>').join("");
      return '<button type="button" class="wm-cell" data-a="ir-dia" data-fecha="' + d + '" aria-label="' + esc(k.nombre + ", " + DIAS_L[wd(d)] + " " + fCorta(d) + ", " + fmtH(hh)) + '"><div class="strip">' + segs + '</div><span class="small muted num">' + (abierto(d) ? fmtH(hh) : "cerrado") + "</span></button>";
    }).join("");
    html += '<button type="button" class="wm-cell" data-a="ver-semana-cons" data-id="' + k.id + '"><b style="font-size:.88rem;color:var(--accent-strong)">' + esc(k.nombre) + '</b><span class="small muted num">' + (disp ? Math.round((h / disp) * 100) : 0) + "% en la semana</span></button>" + celdas;
  });
  return html + '</div></div><p class="small muted">Tocá un consultorio para ver su semana hora por hora, o una celda para abrir ese día.</p>';
}
function calendarioMes(f) {
  const ym = mesDe(f), primero = ym + "-01", inicio = addDays(primero, -wd(primero)), h = hoy();
  let html = '<div class="grid-scroll"><div class="mg">' + DIAS.map((d) => '<div class="mg-h">' + d + "</div>").join("");
  for (let i = 0; i < 42; i++) {
    const d = addDays(inicio, i), dentro = mesDe(d) === ym;

  }

}

async function terminarSerie(key) {
  const x = encontrarItem(key); if (!x || x.kind !== "serie") return cerrarModal();
  const s = D.series[x.id], fin = addDays(x.fecha, -1);
  if (fin < s.inicio) await del("series", x.id); else await put("series", x.id, { ...s, fin });
  toast("El horario fijo termina el " + fCorta(fin < s.inicio ? s.inicio : fin) + ".");
  cerrarModal();
}
function textoEstado(p) {
  const c = cuenta(p.id);
  const ult = c.movs.slice(-6).map((m) => "• " + fCorta(m.fecha) + " " + m.concepto + ": " + (m.tipo === "pago" || m.tipo === "credito" ? "−" : "") + money(m.importe)).join("\n");
  return "Hola " + p.nombre.split(" ")[0] + ". Tu estado de cuenta en " + (D.config.nombre || "el consultorio") + " al " + fCorta(hoy()) + ":\n" + ult + "\nSaldo: " + money(c.saldo) + (c.vencido > 0 ? " (vencido " + money(c.vencido) + ")" : "") + (c.futuros ? "\nReservas próximas: " + money(c.futuros) : "") + "\n¡Gracias!";
}
async function exportar(tipo) {
  if (!downloads) return toast("Esta vista no permite descargar archivos. Abrí la app desde Claude.");
  try {
    if (tipo === "csv") {
      const rows = [["fecha", "profesional", "tipo", "concepto", "medio", "importe"]].concat(lista("movimientos").sort((a, b) => (a.fecha < b.fecha ? -1 : 1)).map((m) => [m.fecha, nomProf(m.profesionalId), m.tipo, m.concepto || "", m.medio || "", (m.tipo === "pago" || m.tipo === "credito" ? -1 : 1) * Number(m.importe || 0)]));
      await downloads.save({ filename: "movimientos-" + hoy() + ".csv", data: "﻿" + rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(";")).join("\n") });
    } else {
      const out = { app: "mis-consultorios", version: 1, exportado: new Date().toISOString(), config: D.config };
      COLS.forEach((c) => (out[c] = lista(c)));
      await downloads.save({ filename: "respaldo-consultorios-" + hoy() + ".json", data: JSON.stringify(out, null, 1) });
    }
    toast("Archivo listo");
  } catch (e) { if (e && e.code !== "declined") toast("No se pudo descargar el archivo."); }
}
async function importar(file) {
  try {
    const o = JSON.parse(await file.text());
    if (o.app !== "mis-consultorios") return toast("Ese archivo no es un respaldo de esta app.");
    if (o.config) await putConfig(o.config);
    for (const c of COLS) for (const r of o[c] || []) if (r && r.id) await put(c, r.id, r);
    toast("Respaldo restaurado");
  } catch (e) { toast("No se pudo leer el archivo."); }
}

/* ---- Cambios en campos ---- */
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-change]"); if (!el) return;
  const k = el.dataset.change;
  if (k === "consSel") { UI.consSel = el.value; if (el.value && UI.vista === "dia") UI.vista = "semana"; render(); return; }
  if (k === "importar") { const f = el.files && el.files[0]; if (f) importar(f); el.value = ""; return; }
  if (k === "pago-prof") { UI.modal.id = el.value; renderModal(); return; }
  if (k === "pv-prof") { UI.profVista = el.value; UI.pvDesde = null; render(); return; }
  if (k === "pv-desde") { UI.pvDesde = Number(el.value); render(); return; }
  if (k === "pv-rep") { if (UI.modal) { UI.modal.rep = Number(el.value); renderModal(); } return; }
  if (k === "prof-calc") {
    const f = el.closest("form"); if (!f) return;
    const forma = (f.querySelector('input[name="forma"]:checked') || {}).value || "hora";
    const pm = f.querySelector("#pf-modulos"), pe = f.querySelector("#pf-especial");
    if (pm) pm.hidden = forma !== "modulos"; if (pe) pe.hidden = forma !== "especial";
    const px = f.querySelector("#pf-extra"); if (px) px.hidden = forma === "hora";
    const plan = {}; tarifario().modulos.forEach((mod) => { const i = f.querySelector('[name="mod_' + mod.id + '"]'); if (i && Number(i.value) > 0) plan[mod.id] = Number(i.value); });
    const tot = totalPlan(plan), out = f.querySelector("#pf-total");
    if (out) out.innerHTML = "Total: <b>" + money(tot.precio) + "</b> por mes · " + tot.horas + " h semanales";
    return;
  }
  if (k === "tf-campo") {
    const T = UI.tarifasDraft; if (!T) return;
    if (el.name === "hora") T.hora = Number(el.value) || 0;
    else { const [campo, mid] = el.name.split("__"); const mod = T.modulos.find((x) => x.id === mid); if (mod) mod[campo] = campo === "nombre" ? el.value : Number(el.value) || 0; }
    const row = el.closest("[data-mod]");
    if (row) { const mod = T.modulos.find((x) => x.id === row.dataset.mod); const ph = row.querySelector(".tf-ph"); if (mod && ph) ph.textContent = mod.horas ? money(mod.precio / (mod.horas * 4.33)) + "/h" : "—"; }
    return;
  }
  if (k === "r-campo" || k === "r-check") {
    const d = UI.modal.d, campo = el.dataset.k;
    let val = k === "r-check" ? el.checked : el.value;
    if (campo === "desde" || campo === "hasta") val = Number(val);
    d[campo] = val;
    if (campo === "desde" && d.hasta <= d.desde) d.hasta = Math.min(cierraMin(), d.desde + 60);
    if (campo === "desde" || campo === "hasta" || campo === "profesionalId" || campo === "consultorioId") { if (d.tipo === "reserva") d.importe = null; }
    UI.modal.avisado = false; UI.modal.err = "";
    if (campo !== "nota" && campo !== "importe") { chequearReserva(); renderModal(); }
  }
});

      const dias = DIAS.map((_, i) => fd.get("dia" + i) === "on");
      await putConfig({ nombre: g("nombre"), abre: g("abre") || "08:00", cierra: g("cierra") || "21:00", diasAbiertos: dias, configurado: true, tarifario: { hora: Number(g("precio")) || 0, modulos: [], historial: [] } });
      for (let i = 1; i <= n; i++) await put("consultorios", uid(), { nombre: "Consultorio " + i, orden: i, color: COLORES[(i - 1) % COLORES.length], precioHora: 0, activo: true });
      UI.tab = "agenda"; UI.vista = "dia"; recordarUI(); toast("Listo. Tocá un espacio de la agenda para reservar."); render(); break;
    }
    case "reserva": {
      const imp = $("#r-imp"); if (imp) UI.modal.d.importe = imp.value;
      const nota = $("#r-nota"); if (nota) UI.modal.d.nota = nota.value;
      await guardarReserva(); break;
    }
    case "prof": {
      const id = UI.modal.id || uid(), viejo = UI.modal.id ? prof(UI.modal.id) : {};
      if (!g("nombre")) return;
      const forma = g("forma") || "hora", plan = {};
      tarifario().modulos.forEach((mod) => { const q = Number(fd.get("mod_" + mod.id)) || 0; if (q > 0) plan[mod.id] = q; });
      const tot = totalPlan(plan);
      const precioMensual = forma === "modulos" ? tot.precio : forma === "especial" ? Number(g("precioMensual")) || 0 : 0;
      if (forma === "modulos" && !tot.precio) { UI.modal.err = "Elegí al menos un módulo."; return renderModal(); }
      if (forma === "especial" && !precioMensual) { UI.modal.err = "Cargá el precio mensual especial."; return renderModal(); }
      await put("profesionales", id, { ...viejo, nombre: g("nombre"), profesion: g("profesion"), matricula: g("matricula"), telefono: g("telefono"), email: g("email"), modalidad: forma === "hora" ? "hora" : "mensual", planTipo: forma === "hora" ? null : forma, plan: forma === "modulos" ? plan : {}, horasPlan: forma === "modulos" ? tot.horas : forma === "especial" ? Number(g("horasPlan")) || 0 : 0, precioHora: Number(g("precioHora")) || 0, precioMensual, extraPorHora: forma !== "hora" && fd.get("extraPorHora") === "on", notas: g("notas"), activo: viejo.activo !== false, alta: viejo.alta || hoy() });
      toast("Profesional guardado"); abrirModal({ t: "prof", id, wide: true }); break;
    }
    case "pago": {
      const pid = g("profesionalId"), imp = Number(g("importe"));
      if (!pid || !(imp > 0)) return;
      await put("movimientos", uid(), { profesionalId: pid, tipo: "pago", importe: imp, fecha: g("fecha") || hoy(), medio: g("medio"), concepto: "Pago" + (g("nota") ? " · " + g("nota") : "") });
      toast("Pago de " + money(imp) + " registrado"); abrirModal({ t: "prof", id: pid, wide: true }); break;
    }
    case "cargo": {
      const pid = g("profesionalId"), imp = Number(g("importe"));
      if (!(imp > 0)) return;
      await put("movimientos", uid(), { profesionalId: pid, tipo: g("tipo") === "credito" ? "credito" : "cargo", importe: imp, fecha: g("fecha") || hoy(), concepto: g("concepto") });
      toast("Guardado"); abrirModal({ t: "prof", id: pid, wide: true }); break;
    }
    case "gasto": {
      const imp = Number(g("importe")); if (!(imp > 0)) return;
      const gid = UI.modal.id || uid(), pagadoPor = g("pagadoPor");
      await put("gastos", gid, { importe: imp, fecha: g("fecha") || hoy(), categoria: g("categoria"), descripcion: g("descripcion"), consultorioId: g("consultorioId"), pagadoPor });
      if (pagadoPor) await put("socmov", "gp-" + gid, { socioId: pagadoPor, tipo: "aporte", importe: imp, fecha: g("fecha") || hoy(), nota: "Pagó de su bolsillo: " + (g("descripcion") || g("categoria")), gastoId: gid });
      else if (D.socmov["gp-" + gid]) await del("socmov", "gp-" + gid);
      UI.mesGastos = mesDe(g("fecha") || hoy()); cerrarModal(); toast("Gasto guardado"); break;
    }
    case "pv-pago": {
      const imp = Number(g("importe")); if (!(imp > 0)) return;
      await put("avisos", uid(), { tipo: "pago", profesionalId: UI.profVista, importe: imp, fecha: g("fecha") || hoy(), medio: g("medio"), nota: g("nota"), estado: "pendiente", creado: new Date().toISOString() });
      cerrarModal(); render(); toast("Aviso enviado. Cuando el dueño lo confirme, se descuenta."); break;
    }
    case "pv-problema": {
      if (!g("texto")) return;
      await put("avisos", uid(), { tipo: "problema", profesionalId: UI.profVista, consultorioId: g("consultorioId"), texto: g("texto"), estado: "pendiente", creado: new Date().toISOString() });
      render(); toast("Aviso enviado al dueño"); break;
    }
    case "socio": {
      const id = UI.modal.id || uid(), viejo = UI.modal.id ? D.socios[UI.modal.id] : {};
      await put("socios", id, { ...viejo, nombre: g("nombre"), porcentaje: Number(g("porcentaje")) || 0, telefono: g("telefono"), activo: UI.modal.id ? fd.get("activo") === "on" : true });
      cerrarModal(); toast("Socio guardado"); break;
    }
    case "socmov": {
      const imp = Number(g("importe")); if (!(imp > 0)) return;
      await put("socmov", uid(), { socioId: g("socioId"), tipo: g("tipo") === "aporte" ? "aporte" : "retiro", importe: imp, fecha: g("fecha") || hoy(), nota: g("nota") });
      UI.mesSocios = mesDe(g("fecha") || hoy()); cerrarModal(); toast(g("tipo") === "aporte" ? "Aporte registrado" : "Retiro registrado"); break;
    }
    case "tarea": {
      const tid = UI.modal.id || uid(), t0 = UI.modal.id ? D.tareas[tid] : {};
      await put("tareas", tid, { ...t0, titulo: g("titulo"), consultorioId: g("consultorioId"), proxima: g("proxima"), cadaDias: Number(g("cadaDias")) || 0, nota: g("nota"), estado: UI.modal.id && fd.get("hecha") === "on" ? "hecha" : "pendiente" });
      cerrarModal(); toast("Tarea guardada"); break;
    }
    case "cons": {
      const id = UI.modal.id || uid(), viejo = UI.modal.id ? cons(UI.modal.id) : { orden: lista("consultorios").length + 1 };
      await put("consultorios", id, { ...viejo, nombre: g("nombre"), precioHora: Number(g("precioHora")) || 0, superficie: Number(g("superficie")) || 0, color: g("color"), equipamiento: g("equipamiento"), activo: fd.get("activo") === "on" });
      cerrarModal(); toast("Consultorio guardado"); break;
    }
    case "tarifas": {
      const T = UI.tarifasDraft; if (!T) break;
      const viejo = tarifario();
      if (T.modulos.some((m) => !String(m.nombre).trim() || !(Number(m.horas) > 0) || !(Number(m.precio) > 0))) { toast("Completá nombre, horas y precio de cada módulo."); break; }
      const partes = [];
      if (Number(T.hora) !== Number(viejo.hora)) partes.push("hora " + money(viejo.hora) + " → " + money(T.hora));
      T.modulos.forEach((m) => { const v = viejo.modulos.find((x) => x.id === m.id); if (!v) partes.push("nuevo " + m.nombre + " " + money(m.precio)); else if (Number(v.precio) !== Number(m.precio) || v.nombre !== m.nombre || Number(v.horas) !== Number(m.horas)) partes.push(m.nombre + " " + money(v.precio) + " → " + money(m.precio)); });
      viejo.modulos.forEach((v) => { if (!T.modulos.find((m) => m.id === v.id)) partes.push("quitado " + v.nombre); });
      const historial = (viejo.historial || []).concat(partes.length ? [{ fecha: hoy(), detalle: (T._aumento ? "Aumento " + T._aumento + "%: " : "") + partes.join(" · ") }] : []).slice(-40);
      await putConfig({ tarifario: { hora: Number(T.hora) || 0, modulos: T.modulos.map((m) => ({ id: m.id, nombre: String(m.nombre).trim(), horas: Number(m.horas), precio: Number(m.precio) })), historial } });
      let n = 0;
      for (const p of profesionalesAct().filter((x) => x.modalidad === "mensual" && x.planTipo === "modulos")) { const t = totalPlan(p.plan); if (t.precio !== Number(p.precioMensual) || t.horas !== Number(p.horasPlan)) { n++; await put("profesionales", p.id, { ...p, precioMensual: t.precio, horasPlan: t.horas }); } }
      UI.tarifasDraft = null; render();
      toast("Tarifas guardadas" + (n ? ". Se actualizó la cuota de " + n + " profesional" + (n > 1 ? "es" : "") + "." : ".") + (n && cargosPendientes(mesDe(hoy())).length ? " Revisá Cobros para actualizar los cargos del mes." : ""));
      break;
    }
    case "ajustes": {
      const dias = DIAS.map((_, i) => fd.get("dia" + i) === "on");
      const abre = g("abre") || "08:00", cierra = g("cierra") || "21:00";
      if (toMin(cierra) <= toMin(abre)) return toast("La hora de cierre tiene que ser posterior a la de apertura.");
      await putConfig({ nombre: g("nombre"), abre, cierra, diasAbiertos: dias, horasCancelacion: Number(g("horasCancelacion")) || 0, diasGracia: Number(g("diasGracia")) || 0, datosPago: String(fd.get("datosPago") || "").trim(), configurado: true });
      toast("Cambios guardados"); break;
    }
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && UI.modal) cerrarModal(); });
setInterval(() => { if (listo && UI.tab === "agenda" && !UI.modal) render(); }, 5 * 60 * 1000);

render();
iniciar();
</script>
